name: Docs freshness

# Scheduled cross-repo docs freshness monitor (CTX-0019, follow-up referenced
# in bitty-docs CTX-0150).
#
# The deterministic `docs:check` gate (CTX-0017) fails only when the committed
# mirror diverges from the _pinned_ revisions. It cannot see that a pin has
# fallen behind its source's default branch. This workflow closes that gap as
# an advisory signal: once a week it reads every entry of the schema-2 pin file
# `src/content/docs-revision.json` and compares each pinned revision against
# that source's own default-branch HEAD, filing the drift where humans look. It
# never blocks releases; `docs:check` remains the blocker.
#
# Tracking-issue contract (exactly one issue ever carries the
# `docs-freshness` label, however many sources are pinned):
# - Title: `[docs-freshness] bitty-docs pin behind main (<short-head-sha>)`
#   (with several sources: `[docs-freshness] <n> docs sources <descriptor>`).
# - Labels: `docs-freshness,area:website,P2`; milestone `v0.1.0`.
# - Body carries a machine marker
#   `<!-- docs-freshness:v2 status=<status> head=<sha> pins=<id>:<sha>,...
#   heads=<id>:<sha>,... -->` that lists every pin and every resolved HEAD,
#   plus a human summary, one row per pinned source (revision, published page
#   count, HEAD, compare status, compare link), and the per-source
#   `just docs-sync --source <id> --pin <head>` fix.
# - The published page count in each row is read from the committed
#   `src/content/docs-manifest.json` (the same numbers `docs:check` gates); an
#   absent or stale manifest entry fails the job naming the source, exactly
#   like a missing pin revision, so the report can never disagree with the
#   gate.
# - Behind (or ahead/diverged): create the issue, or reopen and update the
#   closed one when the recorded marker moved; comment only when any pin or
#   HEAD changed, so weekly runs do not spam.
# - Identical: close an open tracking issue as resolved; otherwise do nothing.
#
# Triggers:
# - schedule: weekly, Monday 07:23 UTC (off the hour to avoid scheduler load).
# - workflow_dispatch: manual run; set `dry_run` to true to print the planned
#   create/update/comment/close actions without touching the Issues API.
#
# Privileges and secrets: `contents: read` (checkout the pin file) plus
# `issues: write` (create/update/comment/close the one tracking issue). No
# custom secrets; only the automatic `GITHUB_TOKEN`, never echoed. Each
# source's HEAD resolves over anonymous HTTPS (`git ls-remote`, derived from
# that entry's `source` slug) and the ahead/behind verdict comes from the
# compare API, so no second checkout.

on:
  schedule:
    # Weekly on Monday at 07:23 UTC.
    - cron: "23 7 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only; never create, update, comment, or close issues"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: docs-freshness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freshness:
    name: Check docs pin freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Compare every pin against its source HEAD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail

          this_repo="bitty-terminal/bitty-website"
          pin_file="src/content/docs-revision.json"
          label="docs-freshness"
          nl=$'\n'

          dry_run="${DRY_RUN_INPUT:-false}"
          dry_run="$(printf '%s' "$dry_run" | tr '[:upper:]' '[:lower:]')"

          # Read every pinned source (schema 2). A bare `jq -r .revision` on the
          # schema-2 object yields the literal string "null", which then slipped
          # past the guard, and the pre-#98 scalar `revision` no longer exists
          # at all. A missing file, a non-array/empty `sources`, or any source
          # without a non-empty id/source/revision fails the job and names every
          # offending source, so freshness tracking can never stop silently.
          if [ ! -f "$pin_file" ]; then
            echo "::error::$pin_file is missing"
            exit 1
          fi
          if ! jq -e '
              .schema == 2
              and (.sources | type == "array")
            ' "$pin_file" >/dev/null; then
            echo "::error::$pin_file must be a schema-2 pin with a sources[] array (the pre-#98 scalar revision is retired)"
            exit 1
          fi
          if ! jq -e '(.sources | length > 0)' "$pin_file" >/dev/null; then
            echo "::error::$pin_file pins no source: sources[] is empty"
            exit 1
          fi
          bad_sources="$(jq -r '
              .sources[]
              | select((.id | type) != "string" or (.id | length) == 0
                       or (.source | type) != "string" or (.source | length) == 0
                       or (.revision | type) != "string"
                       or (.revision | length) == 0)
              | (.id // "(entry without an id)")
            ' "$pin_file")"
          if [ -n "$bad_sources" ]; then
            while IFS= read -r bad_source; do
              echo "::error::source \"$bad_source\" in $pin_file has no usable id, source or revision (each schema-2 sources[] entry needs a non-empty id, source, and revision string; a scalar read returns null)"
            done <<<"$bad_sources"
            exit 1
          fi
          source_rows="$(jq -r '.sources[] | [.id, .source, .revision] | @tsv' "$pin_file")"

          # The published page count in each row comes from the committed
          # manifest — the same numbers `docs:check` gates. A missing file, a
          # non-schema-2 manifest, a pinned source absent from it, or an entry
          # that lags the pin would make the row a guess, so each fails the job
          # naming the source.
          manifest_file="src/content/docs-manifest.json"
          if [ ! -f "$manifest_file" ]; then
            echo "::error::$manifest_file is missing; run \`just docs-sync\`"
            exit 1
          fi
          if ! jq -e '.schema == 2 and (.sources | type == "array")' "$manifest_file" >/dev/null; then
            echo "::error::$manifest_file must be a schema-2 manifest with a sources[] array; run \`just docs-sync\`"
            exit 1
          fi

          # One row per pinned source: resolve that source's default-branch HEAD
          # and compare the pinned revision against it. The issue body, the
          # marker, the title, and the close/reopen verdict all come from these
          # rows; exactly one tracking issue carries the label.
          n_sources=0
          total_published=0
          first_head=""
          first_short=""
          overall="identical"
          detail_rows=""
          marker_pins=""
          marker_heads=""
          title_ids=""

          while IFS=$'\t' read -r id slug revision; do
            n_sources=$((n_sources + 1))
            case "$revision" in
              "" | "null")
                echo "::error::source \"$id\" in $pin_file has no revision"
                exit 1
                ;;
            esac

            # The row reports the published page count exactly as the committed
            # manifest records it, so the report and `docs:check` cannot
            # disagree; a source the manifest does not know, a non-numeric
            # count, or an entry that lags the pin fails loudly.
            manifest_row="$(jq -r --arg id "$id" '
                .sources[] | select(.id == $id)
                | [.revision, (.counts.published | tostring)] | @tsv
              ' "$manifest_file")"
            if [ -z "$manifest_row" ]; then
              echo "::error::source \"$id\" is pinned in $pin_file but absent from $manifest_file; run \`just docs-sync\`"
              exit 1
            fi
            IFS=$'\t' read -r manifest_revision published <<<"$manifest_row"
            if ! printf '%s' "$published" | grep -Eq '^[0-9]+$'; then
              echo "::error::source \"$id\" in $manifest_file has no numeric published count (read \"$published\")"
              exit 1
            fi
            if [ "$manifest_revision" != "$revision" ]; then
              echo "::error::source \"$id\" manifest revision ${manifest_revision} is stale vs the pin ${revision}; run \`just docs-sync\`"
              exit 1
            fi
            total_published=$((total_published + published))
            # `source` is a host/owner/repo slug; the compare API and the git
            # remote both want owner/repo.
            repo="${slug#https://}"
            repo="${repo#http://}"
            repo="${repo#github.com/}"
            if ! printf '%s' "$repo" | grep -Eq '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$'; then
              echo "::error::source \"$id\" has an unusable source slug \"$slug\""
              exit 1
            fi

            head="$(git ls-remote "https://github.com/${repo}.git" HEAD | cut -f1)"
            if [ -z "$head" ]; then
              echo "::error::cannot resolve HEAD of $repo"
              exit 1
            fi
            compare="$(gh api "repos/${repo}/compare/${revision}...${head}" \
              --jq '{status: .status, ahead_by: .ahead_by, behind_by: .behind_by}')"
            status="$(printf '%s' "$compare" | jq -r .status)"
            ahead_by="$(printf '%s' "$compare" | jq -r .ahead_by)"
            behind_by="$(printf '%s' "$compare" | jq -r .behind_by)"
            if [ -z "$status" ] || [ "$status" = "null" ]; then
              echo "::error::cannot compare ${revision}...${head} in $repo"
              exit 1
            fi

            # Compare direction: base=pin, head=docs HEAD. "ahead" means the
            # source HEAD moved past the pin (the normal behind case); any other
            # non-identical status means the pin is not an ancestor of HEAD
            # (rewound history or a wrong pin). The aggregate stays "identical"
            # only when every source matches its HEAD.
            case "$status" in
              identical) verdict="is current with the default-branch HEAD" ;;
              ahead)
                verdict="is **${ahead_by} commit(s) behind** the default-branch HEAD"
                if [ "$overall" = "identical" ]; then overall="ahead"; fi
                ;;
              *)
                verdict="is **not an ancestor** of the default-branch HEAD (compare status **${status}**, ${behind_by} behind)"
                overall="$status"
                ;;
            esac

            detail_rows="${detail_rows}- \`${id}\` (${repo}): pin \`${revision}\` publishes ${published} page(s), ${verdict} \`${head}\`; compare https://github.com/${repo}/compare/${revision}...${head}${nl}"
            marker_pins="${marker_pins}${marker_pins:+,}${id}:${revision}"
            marker_heads="${marker_heads}${marker_heads:+,}${id}:${head}"
            title_ids="${title_ids}${title_ids:+ }${id}"
            if [ -z "$first_head" ]; then
              first_head="$head"
              first_short="$(printf '%s' "$head" | cut -c1-7)"
            fi
          done <<<"$source_rows"

          if [ "$n_sources" -eq 0 ]; then
            echo "::error::$pin_file declares no sources"
            exit 1
          fi

          if [ "$overall" = "identical" ]; then
            descriptor="pin current with main"
            summary="Every pinned source matches its default-branch HEAD. Nothing to do."
          elif [ "$overall" = "ahead" ]; then
            descriptor="pin behind main"
            summary="At least one pinned source is behind its default-branch HEAD."
          else
            descriptor="pin out of sync with main"
            summary="At least one pinned source is not an ancestor of its default-branch HEAD; human review needed."
          fi
          if [ "$n_sources" -eq 1 ]; then
            title="[docs-freshness] ${title_ids} ${descriptor} (${first_short})"
          else
            title="[docs-freshness] ${n_sources} docs sources ${descriptor} (${first_short})"
          fi

          # The marker carries every pin (and every resolved HEAD) so the
          # weekly-dedup comparison below sees any source move, not just the
          # first one.
          marker="<!-- docs-freshness:v2 status=${overall} head=${first_head} pins=${marker_pins} heads=${marker_heads} -->"
          body="Priority: P2 | Area: website | Labels: docs-freshness,area:website,P2 | Milestone: v0.1.0 | RFC: OQ-023 | Task: CTX-0019

          ${summary}

          - Sources pinned in \`${pin_file}\`: ${n_sources} (published ${total_published})
          ${detail_rows}
          To resolve: run \`just docs-sync --source <id> --pin <head>\` for the source(s) behind (equivalently \`bun run sync:docs --source <id> --pin <head>\`), then \`just docs-check && just check\`, and open the website pull request linked to this issue.

          Advisory only: the deterministic \`docs:check\` staleness gate remains the release blocker.

          $marker"

          # The label must exist before it can be used for lookup.
          if [ "$dry_run" = "true" ]; then
            echo "[dry-run] would ensure label '$label' exists"
          else
            gh label create "$label" --repo "$this_repo" \
              --description "Automated docs pin freshness tracking (single issue)" \
              --color "fef2c0" 2>/dev/null || true
          fi

          open_issue="$(gh issue list --repo "$this_repo" --label "$label" \
            --state open --limit 5 --json number,title,body \
            --jq 'sort_by(.number) | last // empty')"
          open_number="$(printf '%s' "$open_issue" | jq -r '.number // empty')"
          open_body="$(printf '%s' "$open_issue" | jq -r '.body // empty')"
          recorded_marker="$(printf '%s' "$open_body" | grep -o '<!-- docs-freshness:v[0-9][^>]*-->' | head -1 || true)"
          recorded_head="$(printf '%s' "$open_body" | grep -o 'head=[0-9a-f]*' | head -1 | cut -d= -f2 || true)"

          if [ "$overall" = "identical" ]; then
            if [ -n "$open_number" ]; then
              if [ "$dry_run" = "true" ]; then
                echo "[dry-run] would close #$open_number as resolved"
              else
                gh issue close "$open_number" --repo "$this_repo" \
                  --comment "Every pinned source matches its default-branch HEAD (${marker_pins}); closing. This issue reopens automatically if a pin falls behind again." \
                  --reason completed
                echo "closed #$open_number as resolved"
              fi
            else
              echo "pins are current and no tracking issue is open; nothing to do"
            fi
            exit 0
          fi

          if [ -z "$open_number" ]; then
            closed_number="$(gh issue list --repo "$this_repo" --label "$label" \
              --state closed --limit 5 --json number \
              --jq '[.[].number] | max // empty')"
            if [ -n "$closed_number" ]; then
              if [ "$dry_run" = "true" ]; then
                echo "[dry-run] would reopen #$closed_number with title '$title'"
              else
                printf '%s\n' "$body" > "$RUNNER_TEMP/freshness-body.md"
                gh issue edit "$closed_number" --repo "$this_repo" \
                  --title "$title" --body-file "$RUNNER_TEMP/freshness-body.md" \
                  --add-label "area:website,P2" --milestone "v0.1.0"
                gh issue reopen "$closed_number" --repo "$this_repo" \
                  --comment "Website docs pins drifted from their default-branch HEAD (status: ${overall}). See the updated body for the per-source compare links and fix. $marker"
                echo "reopened #$closed_number"
              fi
            else
              if [ "$dry_run" = "true" ]; then
                echo "[dry-run] would create an issue with title '$title'"
              else
                printf '%s\n' "$body" > "$RUNNER_TEMP/freshness-body.md"
                gh issue create --repo "$this_repo" \
                  --title "$title" --body-file "$RUNNER_TEMP/freshness-body.md" \
                  --label "$label,area:website,P2" --milestone "v0.1.0"
                echo "created tracking issue"
              fi
            fi
            exit 0
          fi

          if [ "$recorded_marker" = "$marker" ]; then
            echo "tracking issue #$open_number already records $marker; nothing to do"
            exit 0
          fi

          if [ "$dry_run" = "true" ]; then
            echo "[dry-run] would update #$open_number to '$marker' and comment"
          else
            printf '%s\n' "$body" > "$RUNNER_TEMP/freshness-body.md"
            gh issue edit "$open_number" --repo "$this_repo" \
              --title "$title" --body-file "$RUNNER_TEMP/freshness-body.md" \
              --add-label "area:website,P2" --milestone "v0.1.0"
            gh issue comment "$open_number" --repo "$this_repo" \
              --body "Update: the recorded docs pins moved (previously recorded HEAD \`${recorded_head:-unknown}\`); compare status is now ${overall}.

          ${detail_rows}
          $marker"
            echo "updated #$open_number"
          fi
