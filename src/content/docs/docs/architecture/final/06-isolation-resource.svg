    .edge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #94a3b8; text-anchor: middle; }
    .btn-link { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #ffffff; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a" />
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="1200" height="65" fill="#1e293b" />
  <text x="30" y="32" class="title">L1 Isolation Domains &amp; L3 Resource Ceilings</text>
  <text x="30" y="52" class="subtitle">Three isolated security domains (PTY child, Plugin runtime, IPC/MCP), 10 quantitative resource ceilings (RC-1 to RC-10), and 4 failure semantics (FS-1 to FS-4).</text>

