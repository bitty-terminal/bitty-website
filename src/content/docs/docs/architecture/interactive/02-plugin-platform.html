<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L1 Plugin Platform, VM & Event Pipeline — Bitty Architecture</title>
    <link rel="icon" type="image/png" href="assets/bitty-icon.png" />
    <link rel="stylesheet" href="css/diagram-engine.css" />
  </head>
  <body>
    <div class="diagram-app">
      <header class="diagram-header">
        <div class="header-left">
          <a href="index.html" class="brand-badge">
            <div class="logo-icon">B</div>
            <span>Bitty Docs</span>
          </a>
          <div class="diagram-title-wrap">
            <span class="diagram-level-tag">L1</span>
            <h1 class="diagram-title">
              Plugin Platform, VM Sandbox & Event Pipeline
            </h1>
          </div>
        </div>

        <div class="header-center">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input
              type="text"
              id="node-search"
              placeholder="Search stages, budgets..."
              oninput="window.engine.setSearch(this.value)"
            />
          </div>
        </div>

        <div class="header-right">
          <a
            href="../README.md"
            class="btn-text"
            title="Back to Architecture Documentation"
          >
            <span>📖 Docs</span>
          </a>
          <a href="index.html" class="btn-text" title="Architecture Hub">
            <span>📑 Gallery</span>
          </a>
          <button
            class="btn-icon"
            onclick="window.engine.exportPNG()"
            title="Export PNG"
          >
            📷
          </button>
          <button
            class="btn-icon"
            onclick="window.engine.exportSVG()"
            title="Export SVG"
          >
            📐
          </button>
          <button
            class="btn-icon"
            onclick="window.engine.toggleTheme()"
            title="Toggle Dark/Light Mode"
          >
            🌓
          </button>
          <button
            class="btn-icon"
            onclick="window.engine.toggleFullscreen()"
            title="Toggle Fullscreen"
          >
            ⛶
          </button>
        </div>
      </header>

      <div class="filter-bar">
        <span
          style="
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
          "
          >Stages:</span
        >
        <button
          class="filter-chip active"
          data-filter="all"
          onclick="window.engine.setFilter('all')"
        >
          All Stages
        </button>
        <button
          class="filter-chip"
          data-filter="manifest"
          onclick="window.engine.setFilter('manifest')"
        >
          Manifest & Identity
        </button>
        <button
          class="filter-chip"
          data-filter="security"
          onclick="window.engine.setFilter('security')"
        >
          Capability Gates
        </button>
        <button
          class="filter-chip"
          data-filter="vm"
          onclick="window.engine.setFilter('vm')"
        >
          VM Sandbox (Piccolo)
        </button>
        <button
          class="filter-chip"
          data-filter="events"
          onclick="window.engine.setFilter('events')"
        >
          Event Pipeline
        </button>
      </div>

      <main class="diagram-workspace">
        <div id="canvas-container"></div>

        <div class="floating-controls">
          <button
            class="btn-icon"
            onclick="
              window.engine.scale = Math.min(
                window.engine.scale * 1.15,
                window.engine.maxScale,
              );
              window.engine.updateZoomDisplay();
              window.engine.render();
            "
            title="Zoom In"
          >
            ➕
          </button>
          <span class="zoom-level-text" id="zoom-level">100%</span>
          <button
            class="btn-icon"
            onclick="
              window.engine.scale = Math.max(
                window.engine.scale * 0.85,
                window.engine.minScale,
              );
              window.engine.updateZoomDisplay();
              window.engine.render();
            "
            title="Zoom Out"
          >
            ➖
          </button>
          <button
            class="btn-icon"
            onclick="
              window.engine.fitToScreen();
              window.engine.render();
            "
            title="Fit to Screen"
          >
            ⊡
          </button>
        </div>

        <div class="legend-box">
          <div class="legend-title">Sandbox Guarantees</div>
          <div class="legend-item">
            <div
              class="legend-indicator"
              style="background: #eff6ff; border: 1px solid #2563eb"
            ></div>
            Pure-Rust Lua VM (Piccolo)
          </div>
          <div class="legend-item">
            <div
              class="legend-indicator"
              style="background: #fee2e2; border: 1px solid #dc2626"
            ></div>
            Denied Ambient Authority (io/os)
          </div>
          <div class="legend-item">
            <div
              class="legend-indicator"
              style="background: #fef3c7; border: 1px solid #d97706"
            ></div>
            Fuel (10^7) & Memory (32MB) Budget
          </div>
          <div class="legend-item">
            <div
              class="legend-indicator"
              style="background: #fffbeb; border: 1px solid #b45309"
            ></div>
            DropOldest Eviction Policy
          </div>
        </div>

        <aside class="inspector-drawer" id="inspector-drawer">
          <div class="inspector-header">
            <div>
              <h2 class="inspector-node-title" id="inspector-title">
                Component Inspector
              </h2>
              <div class="inspector-node-type" id="inspector-type">
                Select an element
              </div>
            </div>
            <button
              class="btn-icon"
              onclick="window.engine.closeInspector()"
              title="Close Inspector"
            >
              ✕
            </button>
          </div>
          <div class="inspector-body" id="inspector-body"></div>
        </aside>
      </main>
    </div>

    <script src="js/diagrams-data.js"></script>
    <script src="js/diagram-engine.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        window.engine = new DiagramEngine({
          containerId: "canvas-container",
          data: DIAGRAMS_DATA["02-plugin-platform"],
          title: "L1 Plugin Platform, VM & Event Pipeline",
          level: "L1",
        });
      });
    </script>
  </body>
</html>
