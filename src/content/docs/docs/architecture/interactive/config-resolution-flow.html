<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      L2 Config Resolution Flow & Live Reconcile — Bitty Architecture
    </title>
    <link rel="icon" type="image/png" href="assets/bitty-icon.png" />
    <link rel="stylesheet" href="css/diagram-engine.css" />
  </head>
  <body>
    <div class="diagram-app">
      <header class="diagram-header">
        <div class="header-left">
          <a href="index.html" class="brand-badge">
            <div class="logo-icon">B</div>
            <span>Bitty Docs</span>
          </a>
          <div class="diagram-title-wrap">
            <span class="diagram-level-tag">L2</span>
            <h1 class="diagram-title">
              Config Resolution Flow & Live Reconcile
            </h1>
          </div>
        </div>

        <div class="header-center">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input
              type="text"
              id="node-search"
              placeholder="Search resolution steps..."
              oninput="window.engine.setSearch(this.value)"
            />
          </div>
        </div>

        <div class="header-right">
          <a
            href="../README.md"
            class="btn-text"
            title="Back to Architecture Documentation"
          >
            <span>📖 Docs</span>
          </a>
          <a href="index.html" class="btn-text" title="Architecture Hub">
            <span>📑 Gallery</span>
          </a>
          <button
            class="btn-icon"
            onclick="window.engine.exportPNG()"
            title="Export PNG"
          >
            📷
          </button>
          <button
            class="btn-icon"
            onclick="window.engine.exportSVG()"
            title="Export SVG"
          >
            📐
          </button>
          <button
            class="btn-icon"
            onclick="window.engine.toggleTheme()"
            title="Toggle Dark/Light Mode"
          >
            🌓
          </button>
          <button
            class="btn-icon"
            onclick="window.engine.toggleFullscreen()"
            title="Toggle Fullscreen"
          >
            ⛶
          </button>
        </div>
      </header>

      <main class="diagram-workspace">
        <div id="canvas-container"></div>

        <!-- Flow Stepper Controls -->
        <div class="flow-controls">
          <button
            class="btn-icon"
            onclick="window.engine.prevFlowStep()"
            title="Previous Step"
          >
            ◀
          </button>
          <button
            class="btn-icon"
            id="flow-play-btn"
            onclick="window.engine.toggleFlowPlay()"
            title="Play / Pause Flow"
          >
            ▶
          </button>
          <button
            class="btn-icon"
            onclick="window.engine.nextFlowStep()"
            title="Next Step"
          >
            ▶
          </button>
          <span class="flow-step-counter" id="flow-counter">Step 1 / 8</span>
          <div class="flow-title-text" id="flow-description">
            Press Play or Next to simulate execution flow
          </div>
          <button
            class="btn-text"
            onclick="window.engine.setFlowStep(0)"
            style="height: 26px; font-size: 11px; padding: 0 8px"
          >
            Reset
          </button>
        </div>

        <div class="floating-controls">
          <button
            class="btn-icon"
            onclick="
              window.engine.scale = Math.min(
                window.engine.scale * 1.15,
                window.engine.maxScale,
              );
              window.engine.updateZoomDisplay();
              window.engine.render();
            "
            title="Zoom In"
          >
            ➕
          </button>
          <span class="zoom-level-text" id="zoom-level">100%</span>
          <button
            class="btn-icon"
            onclick="
              window.engine.scale = Math.max(
                window.engine.scale * 0.85,
                window.engine.minScale,
              );
              window.engine.updateZoomDisplay();
              window.engine.render();
            "
            title="Zoom Out"
          >
            ➖
          </button>
          <button
            class="btn-icon"
            onclick="
              window.engine.fitToScreen();
              window.engine.render();
            "
            title="Fit to Screen"
          >
            ⊡
          </button>
        </div>

        <aside class="inspector-drawer" id="inspector-drawer">
          <div class="inspector-header">
            <div>
              <h2 class="inspector-node-title" id="inspector-title">
                Component Inspector
              </h2>
              <div class="inspector-node-type" id="inspector-type">
                Select a resolution step
              </div>
            </div>
            <button
              class="btn-icon"
              onclick="window.engine.closeInspector()"
              title="Close Inspector"
            >
              ✕
            </button>
          </div>
          <div class="inspector-body" id="inspector-body"></div>
        </aside>
      </main>
    </div>

    <script src="js/diagrams-data.js"></script>
    <script src="js/diagram-engine.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        window.engine = new DiagramEngine({
          containerId: "canvas-container",
          data: DIAGRAMS_DATA["config-resolution-flow"],
          title: "L2 Config Resolution Flow & Live Reconcile",
          level: "L2",
          isFlow: true,
        });
        window.engine.setFlowStep(0);
      });
    </script>
  </body>
</html>
