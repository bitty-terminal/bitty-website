  <text x="30" y="32" class="title">L1 Core Workspace Topology &amp; 16-Crate DAG</text>
  <text x="30" y="52" class="subtitle">Strict directed acyclic graph (DAG) of the 16 core workspace crates organized into 5 dependency layers, enforcing strict non-inversion rules.</text>

