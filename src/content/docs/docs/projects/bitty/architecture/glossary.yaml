    crate_path: crates/bitty-test-vm

  # --- Logical components (overview) ---
  - id: terminal-truth
    label: Terminal Truth
    kind: domain
    shape: rect
    level: L0
    description: Canonical grid, cursor, modes, scrollback inside bitty-term-state
  - id: vt-parser
    label: VT Parser
    kind: module
    shape: rect
    level: L0
    description: Byte state machine CSI/OSC/DCS/APC to TerminalAction
  - id: pty-master
    label: PTY Master
    kind: resource
    shape: rect
    level: L0
    description: Owned PTY master fd — child holds slave only
  - id: renderer
    label: Renderer
    kind: module
    shape: rect
    level: L0
    description: Consumes Render Snapshot and damage, emits GPU work
  - id: ui-model
    label: UI Model
    kind: domain
    shape: rect
    level: L0
    description: View, LayoutNode, focus, overlay primitives
  - id: render-snapshot
    label: Render Snapshot
    kind: data
    shape: rounded
    level: L1
    description: Damage-derived scene supplied to renderer, never Terminal private structs
  - id: image-store
    label: ImageStore
    kind: data
    shape: rounded
    level: L1
    description: Normalized image placements from Kitty, Sixel, iTerm2 adapters
  - id: damage
    label: Damage
    kind: data
    shape: rounded
    level: L1
    description: Terminal damage set produced by TermState application

  # --- Plugin platform ---
  - id: plugin
    label: Plugin
    kind: capability
    shape: rounded
    level: L1
    description: Third-party or first-party plugin instance, one VM per identity and generation
  - id: manifest
    label: bitty-plugin.toml
    kind: capability
    shape: rounded
    level: L1
    description: Validated manifest with id, version, compat, capabilities, lazy triggers
  - id: capability-grant
    label: Capability Grant
    kind: capability
    shape: rounded
    level: L1
    description: Per manifest-hash grant record binding plugin ID to authorized capabilities
  - id: command-registry
    label: Command Registry
    kind: capability
    shape: rounded
    level: L1
    description: Qualified commands plugin-id:resource, lazy mapping before VM creation
  - id: event-pipeline
    label: Event Pipeline
    kind: capability
    shape: rounded
    level: L1
    description: Observation, interception, lifecycle classes with DropOldest default
  - id: service-registry
    label: Service Registry
    kind: capability
    shape: rounded
    level: L1
    description: Versioned host-mediated inter-plugin services
  - id: plugin-generation
    label: Generation
    kind: capability
    shape: rounded
    level: L2
    description: Monotonic instance counter per plugin ID owning tasks, timers, queues
  - id: plugin-vm
    label: Lua VM
    kind: sandbox
    shape: boundary
    level: L1
    description: Per-plugin isolated Lua VM with restricted stdlib and Fuel budgets
  - id: host-api
    label: Host API
    kind: capability
    shape: rounded
    level: L1
    description: Capability-checked host calls, async or deadline-bounded, never hot path

  # --- Panel and workspace ---
  - id: instance
    label: Instance
    kind: domain
    shape: rect
    level: L1
    description: Top-level process owning one or more native OS windows
  - id: window
    label: Window
    kind: domain
    shape: rect
    level: L1
    description: Native OS window owned by bitty-platform (winit), owns Workspaces
  - id: workspace
    label: Workspace
    kind: domain
    shape: rect
    level: L1
    description: Tiling compositor inside Window owning one LayoutTree, mirrors Hyprland workspace
  - id: layout-tree
    label: LayoutTree
    kind: domain
    shape: rect
    level: L1
    description: Binary tiling tree with H and V interior nodes and View leaves
  - id: view
    label: View
    kind: domain
    shape: rect
    level: L1
    description: Layout leaf hosting at most one content type with stable ViewId
  - id: view-type-terminal
    label: Terminal View
    kind: capability
    shape: rounded
    level: L1
    description: View content hosting TerminalId with PTY, grid, scrollback
  - id: view-type-rich
    label: Rich View
    kind: capability
    shape: rounded
    level: L1
    description: View content hosting RichBlock via bitty-rich
  - id: view-type-browser
    label: Browser View
    kind: capability
    shape: rounded
    level: L1
    description: View content hosting browser surface under dedicated capability
  - id: panel
    label: Panel
    kind: capability
    shape: rounded
    level: L1
    description: Accepted generic workspace-managed application container (Panel Runtime RFC) generalizing View content via ViewContent::Panel(PanelId); PanelId is a distinct newtype from ViewId and TerminalId, addressed as (PanelId, generation); at most one panel host per panel
  - id: headed-panel
    label: Headed Panel
    kind: capability
    shape: rounded
    level: L1
    description: Candidate (Event-Sourced T-1) — human-owned panel; agent read and observe only; touching user work means forking an execution snapshot, never typing into the headed panel. Illustrative-only snapshot field list; shape undecided
  - id: headless-panel
    label: Headless Panel
    kind: capability
    shape: rounded
    level: L1
    description: Candidate (Event-Sourced T-1) — agent-owned panel (read, write, execute); agents act only here; shared headless panels gate on lease or capability; detached panels keep history only. Lease semantics stay defined by the Terminal Platform Boundaries candidate; agent attachment and replacement are owner-pending (bitty-ai-docs)
  - id: fork-snapshot
    label: Fork Snapshot
    kind: capability
    shape: rounded
    level: L2
    description: Candidate (Event-Sourced T-1) — terminal-surface guarantee offering a snapshot fork path (working directory, worktree, environment, recent commands, outputs, context references) so agents never need keystroke access to headed panels. Field list illustrative-only; composition with Panel Environment State inheritance undecided
  - id: panel-event-log
    label: Panel Event Log
    kind: data
    shape: rounded
    level: L1
    description: Candidate (Event-Sourced T-2) — panel history as an immutable append-only Event Log instead of a chat log; aligns with Panel History PH-4 (past appended, never mutated); a future History RFC input, not a replacement of PH-1 through PH-12; vocabulary reconciliation is an open item. Never replaces or mutates Core scrollback (Terminal State RFC)
  - id: workspace-event
    label: Workspace Event
    kind: data
    shape: rounded
    level: L2
    description: "Candidate (Event-Sourced T-2) — illustrative-only vocabulary: task.created, agent.attached, tool.started, tool.progress, tool.finished, artifact.created, decision.recorded, context.shared, agent.message, checkpoint.created. Spellings and record fields (including the durable reason shape) undecided"
  - id: tool-run-record
    label: Tool Run Record
    kind: data
    shape: rounded
    level: L2
    description: Candidate (Event-Sourced T-2) — per-tool-run record shape (input, reason, status, duration, structured summary plus blob references) keeping raw output out of normal model context. Direction, not schema; settled by a future History RFC or RFC amendment
  - id: event-index
    label: Event Index
    kind: data
    shape: rounded
    level: L2
    description: Candidate (Event-Sourced T-3) — SQLite as the queryable index and metadata database (events, tasks, messages, relations, full-text search) in the hybrid storage direction. In open conflict with Panel History PH-3/PH-5 (no SQLite in Core; index rebuildable under the cache home); reconciled by an owning RFC, never chosen here
  - id: content-object-store
    label: Content Object Store
    kind: data
    shape: rounded
    level: L2
    description: Candidate (Event-Sourced T-3) — content-addressed object store (hash-addressed, compressed) for outputs, patches, and snapshots; index versus bytes division of labor with the event index; export and debug formats stay JSON/JSONL interchange, never stores of record
  - id: output-pipeline
    label: Output Pipeline Prefix
    kind: capability
    shape: rounded
    level: L2
    description: Candidate (Event-Sourced T-3) — terminal-owned prefix Raw Output, Blob Store, Structured Parser, Result Summary shrinking tens of kilobytes of logs to tens of tokens of findings with stable hashed context blocks. Context Compiler and LLM stages are owner-pending (bitty-ai-docs)
  - id: output-folding
    label: Output Folding
    kind: capability
    shape: rounded
    level: L2
    description: Candidate (Event-Sourced T-4) — UI collapse (whether the user expands logs) and context materialization (whether logs enter LLM context) are decoupled concepts that must never be coupled. Future consumer of Semantic Terminal CommandBlock anchors (P1 gates folding P2); fold state stays per-view presentation
  - id: inspect-surface
    label: Inspect Surface
    kind: capability
    shape: rounded
    level: L2
    description: Candidate (Event-Sourced T-4) — running tasks expose only status, elapsed time, and parsed progress; full logs load on demand via bounded selectors (tail, errors-only, ranges). Minimal-by-default display contract; spellings and bounds undecided
  - id: history-retention
    label: History Retention
    kind: capability
    shape: rounded
    level: L2
    description: "Candidate (Event-Sourced T-5) — terminal-side retention for the Hot/Warm/Cold divergence: the event log is immutable until GC, so expiry removes via tombstone or segment expiry plus provenance-preserving compression, never in-place edits. Model-context membership never decides persistence; defaults, thresholds, and triggers undecided"
  - id: agent-graph-pointer
    label: Agent Graph (owner-pending)
    kind: capability
    shape: rounded
    level: L1
    description: Owner-pending pointer (bitty-ai-docs) — agent team communication graph, dynamic roles, mailbox IPC, lazy ContextBundles, context manifest/tree/compiler, Git-operation analogues, and task-as-issue semantics are NOT terminal content. Recorded only so readers know what was set aside; transport, identity, and consent stay with the IPC and Agent RFC
  - id: layout-provider
    label: LayoutProvider
    kind: capability
    shape: rounded
    level: L1
    description: Plugin-supplied layout algorithm — dwindle, master, grid — proposing geometry
  - id: decoration
    label: Decoration
    kind: capability
    shape: rounded
    level: L1
    description: Core-owned gaps_in, gaps_out, border, radius validated via ConfigPlan
  - id: gaps-in
    label: gaps_in
    kind: capability
    shape: rounded
    level: L3
    description: Inner gaps between Views
  - id: gaps-out
    label: gaps_out
    kind: capability
    shape: rounded
    level: L3
    description: Outer gaps around Workspace
  - id: border
    label: border
    kind: capability
    shape: rounded
    level: L3
    description: Border thickness owned by Core
  - id: radius
    label: radius
    kind: capability
    shape: rounded
    level: L3
    description: Corner radius owned by Core

  # --- Configuration model ---
  - id: init-lua
    label: init.lua
    kind: data
    shape: rounded
    level: L2
    description: User primary configuration evaluated toward ConfigPlan
  - id: config-vm
    label: Config VM
    kind: sandbox
    shape: boundary
    level: L1
    description: Ephemeral Lua VM evaluating configuration toward declarative data only
  - id: config-plan
    label: ConfigPlan
    kind: data
    shape: rounded
    level: L1
    description: Declarative data produced by Lua, input to Rust validation
  - id: config-validation
    label: Config Validation
    kind: module
    shape: rect
    level: L2
    description: Typed Rust validation of ConfigPlan with schema merge classes
  - id: config-merge
    label: Config Merge
    kind: module
    shape: rect
    level: L2
    description: Layer merge with source attribution and declared precedence
  - id: config-diff
    label: Config Diff
    kind: module
    shape: rect
    level: L2
    description: Diff computed before any effect, reportable with file locations
  - id: config-reconcile
    label: Config Reconcile
    kind: module
    shape: rect
    level: L2
    description: Live-reconcilable application to RuntimeConfig without restart
  - id: runtime-config
    label: RuntimeConfig
    kind: data
    shape: rounded
    level: L1
    description: Typed live configuration held by runtime
  - id: xdg-layers
    label: XDG Layers
    kind: domain
    shape: rect
    level: L1
    description: Core defaults, system, distribution, profile, user, trusted local override, CLI
  - id: config-reload-classes
    label: Reload Classes
    kind: capability
    shape: rounded
    level: L2
    description: Live-reconcilable, restart-required, rejected
  - id: project-trust
    label: Project Trust
    kind: capability
    shape: rounded
    level: L2
    description: Project configuration declarative-data-only T-08 defense

  # --- Package lifecycle ---
  - id: discovered
    label: Discovered
    kind: data
    shape: rounded
    level: L2
    description: Source declares ID and version, nothing trusted
  - id: fetched
    label: Fetched
    kind: data
    shape: rounded
    level: L2
    description: Bytes in quarantine, framing and budget enforced
  - id: verified
    label: Verified
    kind: data
    shape: rounded
    level: L2
    description: Full integrity chain H-A plus H-B plus capability diff passed
  - id: staged
    label: Staged
    kind: data
    shape: rounded
    level: L2
    description: Verified generation in store, not yet active
  - id: activated
    label: Activated
    kind: data
    shape: rounded
    level: L2
    description: Atomic switch makes staged generation active
  - id: retained
    label: Retained
    kind: data
    shape: rounded
    level: L2
    description: Superseded generations bounded for rollback
  - id: lockfile
    label: Lockfile
    kind: data
    shape: rounded
    level: L1
    description: Resolution with digests H-A, H-B, Merkle H-C bound to sources
  - id: package-store
    label: Package Store
    kind: domain
    shape: rect
    level: L1
    description: Content-addressed store for verified generations
  - id: integrity-chain
    label: Integrity Chain
    kind: capability
    shape: rounded
    level: L2
    description: Fetch framing, artifact checksum, manifest validation, hash binding, capability diff
  - id: publisher-trust
    label: Publisher Trust
    kind: capability
    shape: rounded
    level: L2
    description: V-A lock pinning, V-B TOFU, V-C signed releases
  - id: resolver
    label: Resolver
    kind: module
    shape: rect
    level: L1
    description: Pure function (manifest, lock, index) to resolution with semver grammar
  - id: activation-txn
    label: Activation TXN
    kind: capability
    shape: rounded
    level: L2
    description: Preflight, quiesce, commit, wake, confirm phases with all-or-nothing switch

  # --- Isolation and resources ---
  - id: ir-d1-pty
    label: IR-D1 PTY Child
    kind: sandbox
    shape: boundary
    level: L1
    description: Untrusted child owning slave side only, bounded parser input
  - id: ir-d2-plugin
    label: IR-D2 Plugin Runtime
    kind: sandbox
    shape: boundary
    level: L1
    description: One VM per plugin and generation, restricted stdlib, budget-enforced
  - id: ir-d3-ipc
    label: IR-D3 IPC and MCP
    kind: sandbox
    shape: boundary
    level: L1
    description: Unix socket or named pipe with peer credential and scope evaluation
  - id: rc-1-cpu
    label: RC-1 CPU
    kind: capability
    shape: rounded
    level: L3
    description: 10^7 instructions or 50 ms wall per callback, 8 ms warning
  - id: rc-2-mem
    label: RC-2 Memory
    kind: capability
    shape: rounded
    level: L3
    description: 32 MiB per plugin VM
  - id: rc-5-queue
    label: RC-5 Queue
    kind: capability
    shape: rounded
    level: L3
    description: PerSubscription 64, PerPlugin 1024 events or 256 KiB, Global 8192 events or 2 MiB
  - id: fs-1-deny
    label: FS-1 Deny
    kind: capability
    shape: rounded
    level: L2
    description: Transactional denial with no partial state
  - id: fs-2-ladder
    label: FS-2 Ladder
    kind: capability
    shape: rounded
    level: L2
    description: Refuse, terminate callback, suspend generation, disable plugin
  - id: safe-mode
    label: bitty --safe
    kind: capability
    shape: rounded
    level: L1
    description: Loads no third-party plugin, independent of package state

  # --- External boundaries ---
  - id: ipc-channel
    label: IPC Channel
    kind: domain
    shape: rect
    level: L1
    description: Local IPC transport with scopes inspect, input, manage, configure
  - id: mcp-adapter
    label: MCP Adapter
    kind: domain
    shape: rect
    level: L1
    description: Agent and MCP adapter consuming debug protocol as untrusted observation
  - id: debug-protocol
    label: Debug Protocol
    kind: domain
    shape: rect
    level: L1
    description: Versioned inspection interface inside Core boundary
  - id: shell-child
    label: Shell Child
    kind: resource
    shape: rect
    level: L0
    description: Host shell process attached to PTY slave

