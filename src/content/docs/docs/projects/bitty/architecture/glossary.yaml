# Architecture glossary — single source for nodes and edges
# Source of truth for docs/projects/bitty/architecture/d2/*.d2 and mermaid/*.mmd
# Visual rules: rect=module/crate, rounded=panel/capability, dashed=boundary/sandbox, solid=call/depends, dashed=event/async
# Levels: L0 overview, L1 subsystem, L2 flow, L3 relation
schema_version: 1
updated: "2026-09-20"
synchronized_revision: "eb321f7fcfca24008630bee477650528cc11d876"
synchronized_short: "eb321f7"
baseline_revision: "de134ec"
maturity: "Pre-alpha / Engineering Milestones M1-M8 (21 crates at bitty eb321f7, 40 OQs Accepted)"
description: Canonical node and edge inventory for Bitty architecture diagrams
provenance: CTX-0035
revision_note: "21-crate count is pinned to bitty origin/main eb321f7 (2026-09-17): Phase A sixteen plus bitty-compat-lab, bitty-perf, bitty-test-support, plus bitty-panels (CTX-0438 extraction wave, 74361aa) and bitty-test-vm (CTX-0507 VM-tier first slice, ae094b7). ADR-0003 stays the accepted topology contract (amended 2026-09-16 to nineteen); project-state.json (bea338d, 2026-09-14, 19 crates) predates the two additions. Event-Sourced panel additions are Candidate terminal-slice direction from the Event-Sourced Panel Model candidate (specifications/event-sourced-panel-model-candidate.md); Agent Graph halves stay owner-pending pointers to bitty-ai-docs."
event_sourced_status: "Candidate terminal slice (T-1..T-5) from the Event-Sourced Panel Model candidate; not Accepted, not Verified, not normative. Reconciles with the accepted Panel Runtime RFC, Terminal State RFC, core boundaries, and the Panel History candidate open items; never rewrites the append-only history guarantee."

visual_rules:
  rect: "module / crate — D2 rectangle"
  rounded: "panel / capability — D2 rectangle with border-radius"
  boundary: "trust boundary / sandbox — D2 container with stroke-dash"
  solid_edge: "call / depends — D2 solid arrow"
  dashed_edge: "event / async — D2 dashed arrow"

levels:
  L0: overview — system context and trust boundaries
  L1: subsystem — crate and service breakdown
  L2: flow — sequence and lifecycle transitions
  L3: relation — dependency and compatibility matrix

nodes:
